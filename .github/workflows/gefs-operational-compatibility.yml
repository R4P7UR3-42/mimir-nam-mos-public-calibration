name: Isolated public GEFSv12 operational compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-public-gefs-operational-compatibility-v1
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: gefs_dispersion/requirements.txt
      - name: Verify implementation and tests
        working-directory: gefs_dispersion
        run: |
          test "$(sha256sum operational_canary.py | cut -d ' ' -f 1)" = "3c0222fc42ab8767b89a6d5f8b6cc20dab5ac0f4434c9ba6c1065121b5ffbff6"
          test "$(sha256sum test_operational_canary.py | cut -d ' ' -f 1)" = "d007b3fea6c39065bdfa609644df4d685f255b44a88cf0da26a71dca0c093827"
          python3 -m py_compile operational_canary.py test_operational_canary.py
          python3 -m unittest -v test_operational_canary.py
      - name: Install pinned ecCodes decoder
        run: python3 -m pip install --disable-pip-version-check -r gefs_dispersion/requirements.txt
      - name: Verify decoder without inherited dynamic-loader authority
        run: env -u LD_LIBRARY_PATH python3 -c 'import eccodes; assert eccodes.codes_get_api_version() == "2.48.0"'
      - name: Capture exact operational compatibility evidence
        id: canary
        continue-on-error: true
        run: |
          mkdir -p /tmp/mimir-gefs-operational-compatibility-v1
          env -u LD_LIBRARY_PATH python3 gefs_dispersion/operational_canary.py \
            --output /tmp/mimir-gefs-operational-compatibility-v1/operational-canary.json \
            --max-requests 110 \
            --concurrency 10
      - name: Seal evidence
        if: always()
        run: |
          root=/tmp/mimir-gefs-operational-compatibility-v1
          cd "$root"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noaa-gefs-operational-compatibility-v1-${{ github.run_id }}
          path: /tmp/mimir-gefs-operational-compatibility-v1
          if-no-files-found: error
          retention-days: 1
      - name: Preserve terminal source or decoder failure
        if: always() && steps.canary.outcome != 'success'
        run: exit 1
